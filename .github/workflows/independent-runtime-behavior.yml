name: Independent runtime behavior

"on":
  push:
    branches:
      - research/behavior-contracts-20261119

permissions:
  contents: read

jobs:
  behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up locked Python runtime
        uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          extras: '[]'
          cache: 'false'
          cache-python: 'false'
      - name: Run independent behavior tests
        run: '"$HERMES_PYTHON" -IB behavior_tests/run.py'
